name: source-and-setup-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Repository safety
        run: python -B scripts/audit_release.py
      - name: Offline fixtures and portability
        run: python -m pip install --require-hashes -r tests/requirements-fixtures.lock
      - name: Run offline fixtures and portability
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Unit tests (no external assistant)
        run: node --test electron/tests/execution-console.test.cjs electron/tests/kimi-progress.test.cjs electron/tests/kimi-workflow.test.cjs electron/tests/model-metadata.test.cjs electron/tests/navigation-state.test.cjs electron/tests/workbench-layout.test.cjs
      - name: Locked UI dependencies
        working-directory: electron
        run: npm ci --no-fund --no-audit
      - name: UI build
        working-directory: electron
        run: npm run build
